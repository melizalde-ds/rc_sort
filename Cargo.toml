[package]
name = "rc-sort"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Keeps ~/.bashrc and fish config at distro defaults by sorting added lines into ~/.bashrc.d and conf.d"
license = "MIT"
repository = "https://github.com/melizalde-ds/rc_sort"
readme = "README.md"
keywords = ["bash", "fish", "dotfiles", "shell", "systemd"]
categories = ["command-line-utilities"]
exclude = ["rustfmt.toml", ".gitignore", "docs/", ".github/"]

[dependencies]
anyhow = "=1.0.104"
notify-debouncer-mini = "=0.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
similar = "=3.2.1"
ratatui = { version = "=0.30.2", optional = true, default-features = false, features = ["crossterm"] }
clap = { version = "=4.6.8", features = ["derive"] }
clap_complete = "=4.6.12"

[features]
default = ["tui"]
# `rc-sort tidy` opens a full-screen picker in a terminal; without it, tidy is always plain.
tui = ["dep:ratatui"]

[profile.release]
lto = true
codegen-units = 1
strip = true
